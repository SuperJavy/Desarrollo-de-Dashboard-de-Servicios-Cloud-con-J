<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../inicio/header.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light">

  <header class="hero-header">
    <div class="container text-center">
        <h1 class="mb-2">Mi Portafolio Web</h1>
        <p class="mb-4">Proyectos y prácticas de desarrollo web</p>
        <a href="../index.html" class="btn btn-outline-light fw-semibold px-4">
            Inicio
        </a>
    </div>
    </header>

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand"> 🛒ShopMaster</span>

    <form class="d-flex" id="formSearch">
        <input id="txtSearch" class="form-control me-2" type="search" placeholder="Buscar producto">
        <button class="btn btn-outline-light" type="submit">Buscar</button>
    </form>
</nav>

<div class="container mt-4">

    <div class="row mb-3 g-3">
        <div class="col-md-4">
            <select id="cmbCategory" class="form-select">
                <option value="">Todas las categorías</option>
            </select>
        </div>

        <div class="col-md-4">
            <select id="cmbSort" class="form-select">
                <option value="">Ordenar por</option>
                <option value="price-asc">Precio ↑</option>
                <option value="price-desc">Precio ↓</option>
                <option value="title-asc">Título A-Z</option>
                <option value="title-desc">Título Z-A</option>
            </select>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Imagen</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tblProducts"></tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between align-items-center">
        <button class="btn btn-secondary" id="btnPrev">⬅ Anterior</button>
        <span id="lblPage"></span>
        <button class="btn btn-secondary" id="btnNext">Siguiente ➡</button>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
