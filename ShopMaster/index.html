<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ShopMaster | Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light">

<header class="hero-header">
    <div class="container text-center">
        <h1>ShopMaster</h1>
        <p>Panel de administración</p>
        <a href="#" class="btn btn-outline-light btn-sm">Inicio</a>
    </div>
</header>

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">🛒 Administración</span>

    <!-- 🔴 AQUÍ ESTÁ EL FIX -->
    <form class="d-flex" id="formBusqueda">
        <input
            id="inputBusqueda"
            class="form-control me-2"
            type="search"
            placeholder="Buscar producto">
        <button class="btn btn-outline-light" type="submit">
            Buscar
        </button>
    </form>
</nav>

<div class="container mt-4">

    <div class="row mb-3 g-3">
        <div class="col-md-4">
            <select class="form-select" id="selectCategoria">
                <option value="">Todas las categorías</option>
            </select>
        </div>

        <div class="col-md-4">
            <select class="form-select" id="selectOrden">
                <option value="">Ordenar por</option>
                <option value="price-asc">Precio ↑</option>
                <option value="price-desc">Precio ↓</option>
                <option value="title-asc">Título A-Z</option>
                <option value="title-desc">Título Z-A</option>
            </select>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Imagen</th>
                    <th>Título</th>
                    <th>Precio</th>
                    <th>Categoría</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaProductos"></tbody>
        </table>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
